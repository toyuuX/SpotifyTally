<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally – your Spotify stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4faf6;--on:#171d1a;--mut:#4f5b56;--pri:#00695c;--onpri:#fff;--pc:#b6f0e0;--onpc:#00201b;--sc:#ffdcc6;--onsc:#2e1500;--tc:#e6deff;--ontc:#1d1147;--sf:#e6efe9;--line:#c3cdc7;
--spring:cubic-bezier(.34,1.56,.64,1);--font:'Roboto Flex',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--on:#dfe4e0;--mut:#a1aca6;--pri:#5fdbc6;--onpri:#00382f;--pc:#005046;--onpc:#b6f0e0;--sc:#5a3318;--onsc:#ffdcc6;--tc:#3b2e6b;--ontc:#e6deff;--sf:#1a211e;--line:#3a4540}}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--on);font:400 16px/1.5 var(--font)}
body{max-width:1000px;margin:0 auto;padding:20px 20px 80px}
h1,h2,h3,b{font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1.05}
button,label.btn{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:3px}
.hidden{display:none!important}
.btn{display:inline-block;background:var(--pri);color:var(--onpri);border:0;border-radius:28px;padding:14px 26px;font-weight:600;transition:border-radius .35s var(--spring),transform .35s var(--spring)}
.btn:hover{border-radius:16px}.btn:active{transform:scale(.94);border-radius:10px}
.btn.tonal{background:var(--pc);color:var(--onpc)}
.btn.sm{padding:9px 18px;font-size:.9rem}
#err{color:#ba1a1a;margin-top:10px}
#login{min-height:85vh;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:620px}
#login h1{font-size:clamp(4rem,18vw,8rem);color:var(--pri)}
#login p{color:var(--mut);font-size:1.15rem;max-width:42ch}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
header .brand{font:800 1.8rem var(--font);font-stretch:112%;color:var(--pri);margin-right:auto}
header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.range{position:relative;display:inline-flex;background:var(--sf);border-radius:999px;padding:5px;margin-bottom:28px}
.range i{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--pri);transition:transform .55s var(--spring),width .55s var(--spring)}
.range button{position:relative;background:none;border:0;border-radius:999px;padding:10px 20px;color:var(--mut);font-weight:500;transition:color .25s}
.range button[aria-pressed=true]{color:var(--onpri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.card{padding:26px;display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-height:170px;animation:pop .6s var(--spring) both;animation-delay:calc(var(--i,0)*70ms)}
.card b{font-size:clamp(2.4rem,7vw,3.6rem);word-break:break-word}
.card small{font-size:.95rem;opacity:.8}
.c1{background:var(--pc);color:var(--onpc);border-radius:56px 14px 56px 14px}
.c2{background:var(--sc);color:var(--onsc);border-radius:14px 56px 14px 56px}
.c3{background:var(--tc);color:var(--ontc);border-radius:56px}
.c1 a{color:inherit;font-weight:600}
.hero{display:grid;grid-template-columns:minmax(0,230px) 1fr;gap:28px;align-items:center;background:var(--sf);border-radius:48px;padding:24px;margin-bottom:40px;animation:pop .6s var(--spring) .2s both}
.hero img,.hero .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:36px;background:var(--line);transition:border-radius .6s var(--spring),transform .6s var(--spring)}
.hero img:hover{border-radius:50%;transform:rotate(-4deg) scale(1.03)}
.hero small{color:var(--mut)}
.hero h2{font-size:clamp(2rem,5.5vw,3.6rem);margin:6px 0 8px}
.hero p{color:var(--mut)}
.chip{display:inline-block;background:var(--pri);color:var(--onpri);border-radius:999px;padding:5px 14px;font-weight:600;font-size:.9rem;margin-top:14px}
section{margin-bottom:44px}
section>h3{font-size:1.8rem;margin-bottom:14px}
ol{list-style:none;padding:0;display:grid;gap:6px}
@media(min-width:760px){ol.two{grid-template-columns:1fr 1fr;gap:6px 14px}}
.row{display:grid;grid-template-columns:2.2rem 52px 1fr auto;gap:12px;align-items:center;padding:8px 14px 8px 8px;background:var(--sf);border-radius:20px;animation:rise .55s var(--spring) both;animation-delay:calc(var(--i)*16ms);transition:border-radius .4s var(--spring),transform .4s var(--spring)}
.row:hover{border-radius:34px;transform:translateX(4px)}
.row .n{font:800 1rem var(--font);color:var(--mut);text-align:center}
.row img,.row .ph{width:52px;height:52px;object-fit:cover;border-radius:14px;background:var(--line);transition:border-radius .4s var(--spring)}
.row:hover img{border-radius:50%}
.row .t,.row .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t{font-weight:600}.row .s{color:var(--mut);font-size:.875rem}
.row a{color:inherit;text-decoration:none}.row a:hover{text-decoration:underline}
.row .pl{background:var(--pc);color:var(--onpc);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
.artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px}
.artists figure{text-align:center;animation:pop .6s var(--spring) both;animation-delay:calc(var(--i)*40ms)}
.artists img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;background:var(--line);transition:border-radius .5s var(--spring),transform .5s var(--spring)}
.artists figure:hover img{border-radius:32%;transform:scale(1.06) rotate(3deg)}
.artists figcaption{margin-top:8px;font-weight:600;font-size:.9rem}
.bars div{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;margin-bottom:10px;font-size:.9rem}
.bars i{display:block;height:20px;border-radius:999px;background:var(--pri);transform-origin:left;animation:grow .8s var(--spring) both;animation-delay:calc(var(--i)*60ms)}
.bars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.import{background:var(--tc);color:var(--ontc);border-radius:48px 14px 48px 14px;padding:28px;display:grid;gap:12px}
.import h3{font-size:1.5rem}
.import p{font-size:.95rem;max-width:62ch}
.import a{color:inherit;font-weight:600}
.import .acts{display:flex;gap:10px;flex-wrap:wrap}
.note{color:var(--mut)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@media(max-width:640px){.hero{grid-template-columns:1fr;border-radius:36px}.hero img,.hero .ph{max-width:220px}.bars div{grid-template-columns:96px 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main id="login" class="hidden">
  <h1>Tally</h1>
  <p>Sign in with Spotify to see your top songs, artists and genres, plus exact plays and minutes if you add your streaming history.</p>
  <button class="btn" id="loginBtn">Sign in with Spotify</button>
  <div id="err" role="alert"></div>
</main>

<div id="app" class="hidden">
  <header>
    <span class="brand">Tally</span>
    <img id="avatar" alt="" class="hidden">
    <span id="who"></span>
    <button class="btn tonal sm" id="logout">Sign out</button>
  </header>
  <div class="range" role="group" aria-label="Time range">
    <i id="ind"></i>
    <button data-r="short_term" aria-pressed="false">4 weeks</button>
    <button data-r="medium_term" aria-pressed="true">6 months</button>
    <button data-r="long_term" aria-pressed="false">All time</button>
  </div>
  <div id="stats"></div>
  <section class="import" id="import">
    <h3>Exact plays and minutes</h3>
    <p id="impText"></p>
    <div class="acts">
      <label class="btn sm" for="file" tabindex="0" id="fileLbl">Add streaming history</label>
      <input type="file" id="file" accept=".json" multiple class="hidden">
      <button class="btn tonal sm hidden" id="dl">Download history</button>
      <button class="btn tonal sm hidden" id="clear">Remove history</button>
    </div>
  </section>
</div>

<script>
const CLIENT_ID = '8463f80fb95d49698a8eabdb3df97a00';
// Must match a Redirect URI you added in the Spotify dashboard exactly.
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-top-read user-read-recently-played';
const DAYS = { short_term: 28, medium_term: 183, long_term: Infinity };

const $ = s => document.querySelector(s);
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const randomStr = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
const img = o => (o?.images?.[1] || o?.images?.[0] || {}).url || '';
const fmt = n => Math.round(n).toLocaleString();

// ---- Auth (PKCE, no server needed) ----
async function login() {
  const verifier = randomStr(64);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  ls.set('verifier', verifier);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({ client_id: CLIENT_ID,
    response_type: 'code', redirect_uri: REDIRECT, scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge });
}
async function tokenRequest(body) {
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: CLIENT_ID, ...body }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || 'Sign-in failed.');
  ls.set('access', d.access_token); ls.set('expires', Date.now() + d.expires_in * 1000);
  if (d.refresh_token) ls.set('refresh', d.refresh_token);
}
async function getToken() {
  if (Date.now() > Number(ls.get('expires') || 0) - 60000) {
    const refresh = ls.get('refresh'); if (!refresh) return null;
    await tokenRequest({ grant_type: 'refresh_token', refresh_token: refresh });
  }
  return ls.get('access');
}
function logout() { ['access','expires','refresh','verifier'].forEach(ls.del); location.href = REDIRECT; }
async function api(path) {
  const t = await getToken(); if (!t) throw new Error('auth');
  const r = await fetch('https://api.spotify.com/v1' + path, { headers: { Authorization: 'Bearer ' + t } });
  if (r.status === 401) throw new Error('auth');
  if (r.status === 403) throw new Error('Spotify refused access. If your app is in development mode, add this account under User Management in the dashboard.');
  if (r.status === 429) throw new Error('Spotify is rate limiting requests. Try again in a minute.');
  if (!r.ok) throw new Error('Spotify returned an error (' + r.status + ').');
  return r.json();
}

// ---- Streaming history import (Spotify data export) ----
// hist = { t: [[key, name, artist, trackId], ...], d: [[day, trackIdx, ms, plays], ...] }
let hist = null;
const mem = {};
const idb = { db: null,
  open() { return this.db ||= new Promise((res, rej) => { const r = indexedDB.open('tally', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); }); } catch { return mem[k] ?? null; } },
  async set(k, v) { mem[k] = v; try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch {} },
  async del(k) { delete mem[k]; try { const db = await this.open(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch {} } };
const saveHist = () => idb.set('hist', hist);
const tsOf = s => Date.parse(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
const dayOf = s => Math.floor(tsOf(s) / 864e5);

function addPlay(h, at, key, name, artist, id, ms) {
  let i = h.t.findIndex(x => x[0] === key);
  if (i < 0) { i = h.t.length; h.t.push([key, name, artist, id]); }
  const day = Math.floor(at / 864e5), e = h.d.find(e => e[0] === day && e[1] === i);
  if (e) { e[2] += ms; e[3]++; } else h.d.push([day, i, ms, 1]);
}
// Adds plays newer than the last one on file. Spotify only returns your latest 50, so open Tally regularly.
async function mergeRecent(items) {
  if (!hist) return;
  hist.a ||= [];
  hist.last ||= (hist.d.reduce((m, e) => e[0] > m ? e[0] : m, 0) + 1) * 864e5 - 1;
  let n = 0;
  for (const x of items.slice().reverse()) {
    const at = Date.parse(x.played_at), tr = x.track;
    if (!tr?.id || at <= hist.last) continue;
    addPlay(hist, at, 'spotify:track:' + tr.id, tr.name, tr.artists[0]?.name, tr.id, tr.duration_ms);
    hist.a.push([at, tr.id, tr.name, tr.artists[0]?.name, tr.duration_ms]);
    hist.last = at; n++;
  }
  if (n) await saveHist();
}

async function importFiles(files) {
  const tIdx = new Map(), t = [], agg = new Map(); let last = 0;
  for (const f of files) {
    let rows; try { rows = JSON.parse(await f.text()); } catch { throw new Error(f.name + ' is not valid JSON.'); }
    if (rows && Array.isArray(rows.t) && Array.isArray(rows.d)) { hist = rows; await saveHist(); return; } // a history file saved from Tally
    if (!Array.isArray(rows)) continue;
    for (const r of rows) {
      const name = r.master_metadata_track_name || r.trackName;
      const artist = r.master_metadata_album_artist_name || r.artistName;
      const ms = r.ms_played ?? r.msPlayed ?? 0;
      const when = r.ts || r.endTime;
      if (!name || !when) continue; // skips podcasts and malformed rows
      last = Math.max(last, tsOf(when));
      const uri = r.spotify_track_uri, key = uri || artist + '|' + name;
      if (!tIdx.has(key)) { tIdx.set(key, t.length); t.push([key, name, artist, uri ? uri.split(':').pop() : null]); }
      const k = dayOf(when) + '|' + tIdx.get(key), e = agg.get(k) || [dayOf(when), tIdx.get(key), 0, 0];
      e[2] += ms; if (ms >= 30000) e[3]++; // Spotify counts a play after 30 seconds
      agg.set(k, e);
    }
  }
  if (!t.length) throw new Error('No song plays found. Use the Streaming_History_Audio files from the extended history export.');
  const old = hist; hist = { t, d: [...agg.values()], last, a: [] };
  for (const [at, id, name, artist, ms] of old?.a || []) if (at > last) { // keep plays auto-added after this export ends
    addPlay(hist, at, 'spotify:track:' + id, name, artist, id, ms); hist.a.push([at, id, name, artist, ms]); hist.last = Math.max(hist.last, at);
  }
  await saveHist();
}

function compute(range) {
  const anchor = hist.d.reduce((m, e) => e[0] > m ? e[0] : m, 0), cut = anchor - DAYS[range];
  const per = new Map(); let ms = 0, plays = 0;
  for (const [day, i, m, p] of hist.d) {
    if (day <= cut) continue;
    const e = per.get(i) || { i, ms: 0, plays: 0 }; e.ms += m; e.plays += p; per.set(i, e); ms += m; plays += p;
  }
  const top = [...per.values()].sort((a, b) => b.plays - a.plays || b.ms - a.ms).slice(0, 50);
  return { minutes: ms / 60000, plays, top, anchor };
}

// ---- Rendering ----
let range = 'medium_term', recent = null; const art = {};

function row(t, i, rank) {
  const pic = t.art ? `<img src="${esc(t.art)}" alt="" loading="lazy">` : '<div class="ph"></div>';
  return `<li class="row" style="--i:${i}"><span class="n">${rank || ''}</span>${pic}
    <div style="min-width:0"><div class="t"><a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.name)}</a></div><div class="s">${esc(t.artist)}</div></div>
    ${t.badge ? `<span class="pl">${esc(t.badge)}</span>` : ''}</li>`;
}
const norm = t => ({ name: t.name, artist: t.artists.map(a => a.name).join(', '), art: img(t.album), link: t.external_urls?.spotify, id: t.id });

function countUp(el) {
  const to = Number(el.dataset.n), t0 = performance.now(), d = matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 900;
  (function step(now) {
    const p = d ? Math.min((now - t0) / d, 1) : 1;
    el.textContent = fmt(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function moveInd() {
  const b = document.querySelector('.range [aria-pressed=true]');
  $('#ind').style.transform = `translateX(${b.offsetLeft}px)`; $('#ind').style.width = b.offsetWidth + 'px';
}
function importUi() {
  const n = hist ? hist.d.reduce((s, e) => s + e[3], 0) : 0;
  $('#impText').innerHTML = hist
    ? `History loaded: ${fmt(n)} plays across ${fmt(hist.t.length)} songs, up to ${new Date(hist.last || 0).toLocaleDateString(undefined, { dateStyle: 'medium' })}. New plays are added each time you open Tally (Spotify shares your latest 50, and plays added this way count minutes by song length). Download the history as a backup, or add a newer export to fill any gap.`
    : `Spotify’s API doesn’t share play counts or listening time. For exact numbers, request your <b style="font-weight:700">Extended streaming history</b> at <a href="https://www.spotify.com/account/privacy/" target="_blank" rel="noopener">spotify.com/account/privacy</a>, then add the <code>Streaming_History_Audio_*.json</code> files here. They stay in your browser.`;
  $('#clear').classList.toggle('hidden', !hist); $('#dl').classList.toggle('hidden', !hist);
}

async function load() {
  const out = $('#stats'); out.innerHTML = '<p class="note">Loading your stats…</p>'; importUi();
  try {
    const [tracks, artists] = await Promise.all([api(`/me/top/tracks?time_range=${range}&limit=50`), api(`/me/top/artists?time_range=${range}&limit=50`)]);
    if (!recent) recent = await api('/me/player/recently-played?limit=50');
    if (hist) { await mergeRecent(recent.items); importUi(); }
    const T = tracks.items, A = artists.items; T.forEach(t => art[t.id] = img(t.album));

    const S = hist ? compute(range) : null;
    let songs;
    if (S) {
      const need = S.top.map(e => hist.t[e.i][3]).filter(id => id && !art[id]);
      if (need.length) { try { (await api('/tracks?ids=' + need.join(','))).tracks.forEach(t => t && (art[t.id] = img(t.album))); } catch (e) { if (e.message === 'auth') throw e; } }
      songs = S.top.map(e => { const [, name, artist, id] = hist.t[e.i];
        return { name, artist, id, art: art[id], link: id ? 'https://open.spotify.com/track/' + id : '#', badge: fmt(e.plays) + (e.plays === 1 ? ' play' : ' plays') }; });
    } else songs = T.map(norm);
    if (!songs.length) { out.innerHTML = '<p class="note">Not enough listening history for this range yet.</p>'; return; }

    const g = {}; A.forEach((a, i) => (a.genres || []).forEach(x => g[x] = (g[x] || 0) + (A.length - i)));
    const genres = Object.entries(g).sort((a, b) => b[1] - a[1]).slice(0, 8), max = genres[0]?.[1] || 1;
    const distinct = new Set(T.flatMap(t => t.artists.map(a => a.id))).size, top = songs[0];
    const asOf = S ? `Data through ${new Date(S.anchor * 864e5).toLocaleDateString(undefined, { dateStyle: 'medium', timeZone: 'UTC' })}` : '';

    out.innerHTML = `
      <div class="stats">
        <div class="card c1" style="--i:0">${S
          ? `<small>Minutes listened</small><b data-n="${S.minutes}">0</b><small>${fmt(S.minutes / 60)} hours · ${asOf}</small>`
          : `<small>Minutes listened</small><b>–</b><small><a href="#import">Add your streaming history</a> for exact minutes</small>`}</div>
        <div class="card c2" style="--i:1">${S
          ? `<small>Plays</small><b data-n="${S.plays}">0</b><small>${fmt(S.top.length)} songs ranked below</small>`
          : `<small>Artists in your top songs</small><b data-n="${distinct}">0</b><small>across ${T.length} songs</small>`}</div>
        <div class="card c3" style="--i:2"><small>Top genre</small><b style="font-size:${(genres[0]?.[0].length || 0) > 12 ? '1.9rem' : ''}">${esc(genres[0]?.[0] || '–')}</b><small>from your top artists</small></div>
      </div>
      <div class="hero">${top.art ? `<img src="${esc(top.art)}" alt="Cover art">` : '<div class="ph"></div>'}
        <div><small>Your #1 song</small><h2>${esc(top.name)}</h2><p>${esc(top.artist)}</p>${top.badge ? `<span class="chip">${esc(top.badge)}</span>` : ''}</div></div>
      <section><h3>Top ${songs.length} songs</h3><ol class="two">${songs.map((s, i) => row(s, i, i + 1)).join('')}</ol></section>
      <section><h3>Top artists</h3><div class="artists">${A.slice(0, 12).map((a, i) =>
        `<figure style="--i:${i}"><img src="${esc(img(a))}" alt="" loading="lazy"><figcaption>${esc(a.name)}</figcaption></figure>`).join('')}</div></section>
      ${genres.length ? `<section><h3>Top genres</h3><div class="bars">${genres.map(([n, v], i) =>
        `<div><span>${esc(n)}</span><i style="width:${Math.max(4, v / max * 100)}%;--i:${i}"></i></div>`).join('')}</div></section>` : ''}
      <section><h3>Recently played</h3><ol>${recent.items.slice(0, 10).map((x, i) => row(norm(x.track), i, 0)).join('')}</ol></section>`;
    out.querySelectorAll('b[data-n]').forEach(countUp);
  } catch (e) {
    if (e.message === 'auth') return logout();
    out.innerHTML = `<p id="err" role="alert">${esc(e.message)}</p>`;
  }
}

async function showApp() {
  $('#app').classList.remove('hidden'); moveInd();
  try {
    const me = await api('/me'); $('#who').textContent = me.display_name || '';
    const a = img(me); if (a) { $('#avatar').src = a; $('#avatar').classList.remove('hidden'); }
  } catch (e) { if (e.message === 'auth') return logout(); }
  load();
}

// ---- Boot ----
document.querySelectorAll('.range button').forEach(b => b.onclick = () => {
  range = b.dataset.r; document.querySelectorAll('.range button').forEach(x => x.setAttribute('aria-pressed', x === b)); moveInd(); load();
});
addEventListener('resize', () => !$('#app').classList.contains('hidden') && moveInd());
$('#fileLbl').onkeydown = e => (e.key === 'Enter' || e.key === ' ') && (e.preventDefault(), $('#file').click());
$('#file').onchange = async e => {
  try { await importFiles([...e.target.files]); } catch (err) { $('#impText').textContent = err.message; return; }
  e.target.value = ''; load();
};
$('#clear').onclick = async () => { hist = null; await idb.del('hist'); load(); };
$('#dl').onclick = () => { const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ tally: 1, ...hist })], { type: 'application/json' })); a.download = 'tally-history.json'; a.click(); };
$('#loginBtn').onclick = login; $('#logout').onclick = logout;

(async function init() {
  hist = await idb.get('hist'); if (!hist) try { hist = JSON.parse(ls.get('hist') || 'null'); } catch {}
  const q = new URLSearchParams(location.search);
  if (q.get('error')) { history.replaceState({}, '', REDIRECT); $('#login').classList.remove('hidden'); $('#err').textContent = 'Spotify sign-in was cancelled.'; return; }
  if (q.get('code')) {
    try { await tokenRequest({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: ls.get('verifier') }); ls.del('verifier'); }
    catch (e) { history.replaceState({}, '', REDIRECT); $('#login').classList.remove('hidden'); $('#err').textContent = e.message; return; }
    history.replaceState({}, '', REDIRECT);
  }
  if (ls.get('access') || ls.get('refresh')) showApp(); else $('#login').classList.remove('hidden');
})();
</script>
</body>
